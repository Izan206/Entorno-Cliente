<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="grid.css" />
    <title>Grids</title>
  </head>
  <body>
    <h1>Ejemplos de CSS Grid</h1>
    <h2>Grid basico con columnas fijas</h2>
    <div class="reixa ejemplo1">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <h2>Usando fracciones (fr)</h2>
    <div class="reixa ejemplo2">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <h2>Grid con filas definidas</h2>
    <div class="reixa ejemplo3">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <h2>Espaciado entre elementos</h2>
    <div class="reixa ejemplo4">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <h2>Controlando posicion con grid-column y grid-row</h2>
    <div class="reixa ejemplo5">
      <div class="item1">Cabeceira</div>
      <div class="item2">Lateral</div>
      <div class="item3">Contido</div>
      <div class="item4">Lat dereito</div>
      <div class="item5">Pe de paxina</div>
    </div>
  </body>
</html>
