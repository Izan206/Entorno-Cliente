<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1 class="titulo">Formulario de Registro 2</h1>
    <form action="#" method="post">
      <label for="nome">Nome Completo</label>
      <input
        type="text"
        id="nome"
        class="info"
        name="nome"
        placeholder="Ex: Izan Álvarez..."
        required
      />

      <label for="email">Correo Electronico</label>
      <input
        type="email"
        id="email"
        class="info"
        name="email"
        placeholder="abc@gmail.com"
        required
      />

      <label for="contrasinal">Contraseña</label>
      <input
        type="password"
        id="contrasinal"
        class="info"
        name="contrasinal"
        pattern=".{-6,}"
        required
      />

      <label for="data">Fecha de Nacimiento</label>
      <input type="date" id="data" class="info" nome="data" required />

      <fieldset>
        <legend>Xenero</legend>
        <input type="radio" id="femenino" name="xenero" value="femenino" />
        <label for="femenino">Femenino</label>

        <input type="radio" id="masculino" name="xenero" value="masculino" />
        <label for="masculino">Masculino</label>

        <input type="radio" id="outro" name="xenero" value="outro" />
        <label for="outro">Outro</label>
      </fieldset>

      <fieldset>
        <legend>Preferencias</legend>
        <input type="checkbox" id="novas" name="preferencias" value="novas" />
        <label for="novas">Recibir novas por correo</label>

        <input
          type="checkbox"
          id="publicidade"
          name="preferencias"
          value="publicidade"
        />
        <label for="publicidade">Recibir publicidade por correo</label>
      </fieldset>

      <label for="pais">Pais</label>
      <select name="pais" id="pais" class="info" required>
        <option value="">Selecciona una opcion</option>
        <option value="es">España</option>
        <option value="pt">Portugal</option>
        <option value="br">Brasil</option>
      </select>

      <input class="info button" type="submit" value="Rexistrarse" />
    </form>
  </body>
</html>
