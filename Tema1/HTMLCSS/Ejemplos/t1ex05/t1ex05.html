<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="t1ex05.css" />
    <title>Reproductor de Video</title>
  </head>
  <body>
    <header>
      <h1 class="titulo">Multimedia en HTML5</h1>
      <h4 class="linea">
        Exemplo T01EX5: Reproductor de video e audio en HTML y CSS
      </h4>
    </header>
    <main>
      <div class="reproductor">
        <div class="video">
          <h3>Reproductor de video</h3>
          <p>Video de un paxaro cantando</p>
          <video src="video/paxaro.mp4"></video>
        </div>
        <div class="audio">
          <h3>Reproductor de audio</h3>
          <p>Audio do paxaro cantando</p>
          <audio controls>
            <source src="audio/canto.mp3" />
          </audio>
        </div>
      </div>
    </main>
    <footer>&copy2025 Made by Izan</footer>
  </body>
</html>
