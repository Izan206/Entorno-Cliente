<!DOCTYPE html>
<html lang="gl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axenda de Contactos v2</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <div class="contedor-principal">
      <!-- Cabeceira con título -->
      <header>
        <h1>AXENDA DE CONTACTOS</h1>
      </header>

      <!-- Contido principal da vista con dúas columnas -->
      <div class="vista-axenda">
        <!-- Formulario para engadir/buscar contactos -->
        <section id="formulario-seccion">
          <h2>Formulario de Alta e Busca</h2>
          <form id="formulario-contactos" onsubmit="event.preventDefault()">
            <label for="nome" id="lnome">Nome:</label>
            <input type="text" id="nome" name="nome" />

            <label for="apelidos" id="lapelidos">Apelidos:</label>
            <input type="text" id="apelidos" name="apelidos" />

            <label for="data" id="ldata">Data:</label>
            <input type="date" name="data" id="data" />

            <button type="button" id="engadir" onclick="engadirContacto()">
              Engadir
            </button>
            <button type="button" id="buscar" onclick="buscarContacto()">
              Buscar
            </button>
            <button type="button" id="modificar" onclick="modificarContacto()">
              Modificar
            </button>
            <button type="button" id="eliminar" onclick="eliminarContacto()">
              Eliminar
            </button>
          </form>
        </section>

        <!-- Listaxe de contactos -->
        <section id="listaxe-seccion">
          <h2>Lista de Contactos</h2>
          <div id="listaxe-contactos"></div>
        </section>
      </div>
    </div>

    <script language="JavaScript" src="script.js"></script>
  </body>
</html>
